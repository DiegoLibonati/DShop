<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <meta name="author" content="Diego Libonati" />

    <!-- Open Graph (link previews on social / chat) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DShop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="DShop — Fashion &amp; Clothing Store" />
    <meta
      property="og:description"
      content="A responsive fashion storefront and open demo of a polyglot micro-frontend architecture (React, Vue, Angular)."
    />
    <meta property="og:url" content="https://dshop.libonatis.com.ar/" />
    <meta property="og:image" content="https://dshop.libonatis.com.ar/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DShop — fashion & clothing storefront" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DShop — Fashion &amp; Clothing Store" />
    <meta
      name="twitter:description"
      content="A responsive fashion storefront and open demo of a polyglot micro-frontend architecture (React, Vue, Angular)."
    />
    <meta name="twitter:image" content="https://dshop.libonatis.com.ar/og-image.png" />
    <meta name="twitter:site" content="@DieLibonati" />
    <meta name="twitter:creator" content="@DieLibonati" />

    <!-- Structured data: site identity (applies site-wide) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DShop",
        "url": "https://dshop.libonatis.com.ar/",
        "inLanguage": "en"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DShop",
        "url": "https://dshop.libonatis.com.ar/",
        "logo": "https://dshop.libonatis.com.ar/icon-512.png",
        "description": "DShop is a responsive fashion / clothing storefront built as an educational showcase of a polyglot micro-frontend architecture.",
        "founder": {
          "@type": "Person",
          "name": "Diego Libonati",
          "url": "https://diegolibonati.com.ar/",
          "sameAs": ["https://x.com/DieLibonati"]
        }
      }
    </script>

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="modulepreload" href="%VITE_REMOTE_SHARED_CORE_URL%" crossorigin />
    <link rel="modulepreload" href="%VITE_REMOTE_SHARED_REACT_URL%" crossorigin />
    <link rel="modulepreload" href="%VITE_REMOTE_SHARED_ANGULAR_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" data-mfe="container"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
