server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The app is reached through a tunnel that terminates TLS in front of this
    # server, so nginx must not build absolute redirects: it would emit its own
    # scheme and internal port (http://host:8080/) instead of the public URL.
    absolute_redirect off;

    access_log /dev/stdout;
    error_log /dev/stderr;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Replaces X-Frame-Options: its ALLOW-FROM variant is deprecated and ignored
    # by every current browser, so an allowlist is only expressible via CSP.
    # Browsers that support frame-ancestors ignore X-Frame-Options entirely.
    add_header Content-Security-Policy "frame-ancestors 'self' https://diegolibonati.com.ar";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location /api/v1 {
        proxy_pass https://api.escuelajs.co;
        proxy_set_header Host api.escuelajs.co;
        proxy_ssl_server_name on;
    }

    # Reverse-proxy each remote's federation artifacts under the container's
    # single public origin. The trailing slash strips the /mfe/<name>/ prefix,
    # so /mfe/home/remoteEntry.js -> home:8080/remoteEntry.js. Remotes are
    # internal-only (no published ports); they are never reachable directly.
    location ^~ /mfe/home/ {
        proxy_pass http://home:8080/;
    }

    location ^~ /mfe/product-detail/ {
        proxy_pass http://product-detail:8080/;
    }

    location ^~ /mfe/shared-core/ {
        proxy_pass http://shared-core:8080/;
    }

    location ^~ /mfe/shared-react/ {
        proxy_pass http://shared-react:8080/;
    }

    location ^~ /mfe/shared-angular/ {
        proxy_pass http://shared-angular:8080/;
    }

    # The router only knows "/" and "/product/:id". Every other path has to
    # answer 404: serving the SPA shell with a 200 turned each dead footer
    # link (/company/*, /help/*, /faq/*, /resources/*) into a byte-identical
    # copy of the home page, which Search Console reported as "duplicate
    # without canonical", "page with redirect" and "crawled - not indexed".
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/product/[0-9]+$ {
        try_files /index.html =404;
    }

    # Same document as "/", so keep a single indexable URL for it.
    location = /index.html {
        return 301 /;
    }

    # Anything left is a static asset or nothing at all.
    location / {
        try_files $uri =404;
    }

    # Answer 404s with the SPA shell so the app still renders its own
    # not-found screen, while the status line stays 404 for crawlers.
    error_page 404 /_not-found;

    location = /_not-found {
        internal;
        try_files /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /remoteEntry.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}